let player={name:"",kelas:""},lessonIndex=0,quizIndex=0,correct=0,answered=false,seconds=30,timer=null,quizScore=0,gameScore=0,attempts=0,hits=0,players=[],gameOver=false,saved=false;

function setText(id,text){$(id).textContent=text}
function tone(f){if(!soundOn)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.18)}catch(_){}}
$("soundBtn").addEventListener("click",e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?"♫ Suara aktif":"♫ Suara mati";e.currentTarget.setAttribute("aria-label",soundOn?"Matikan suara":"Aktifkan suara");tone(660)});

function renderQuiz(){clearInterval(timer);answered=false;seconds=30;const q=questions[quizIndex];setText("quizProgress",`Soal ${quizIndex+1} / ${questions.length}`);setText("quizScore",`Skor: ${correct*10}`);setText("quizTime","⏱ 30 detik");$("quizBar").style.width=`${quizIndex*10}%`;setText("quizPrompt",q.q);$("quizFeedback").hidden=true;$("quizNext").hidden=true;const box=$("quizOptions");box.replaceChildren();q.o.forEach((text,i)=>{const b=document.createElement("button");b.type="button";b.className="option";b.textContent=`${"ABCD"[i]}. ${text}`;b.addEventListener("click",()=>answerQuiz(i));box.append(b)});timer=setInterval(()=>{seconds--;setText("quizTime",`⏱ ${seconds} detik`);if(seconds<=0)answerQuiz(-1)},1000)}
function answerQuiz(choice){if(answered)return;answered=true;clearInterval(timer);attempts++;const q=questions[quizIndex],ok=choice===q.a;if(ok){correct++;hits++;tone(770)}else tone(220);[...$("quizOptions").children].forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("correct");else if(i===choice)b.classList.add("wrong")});setText("quizScore",`Skor: ${correct*10}`);setText("quizFeedback",`${ok?"Tepat!":choice<0?"Waktu habis.":"Belum tepat."} ${q.e}`);$("quizFeedback").hidden=false;$("quizNext").hidden=false;$("quizNext").textContent=quizIndex===9?"Lihat hasil →":"Soal berikutnya →"}
$("quizNext").addEventListener("click",()=>{if(quizIndex===9){quizScore=correct*10;show("results")}else{quizIndex++;renderQuiz()}});
function startGame(count){players=Array.from({length:count},(_,i)=>({name:i===0?player.name||"Pemain 1":"Pemain 2",distance:0,turn:0,points:0}));gameScore=0;gameOver=false;saved=false;const arena=$("arena");arena.replaceChildren();arena.classList.toggle("solo",count===1);setText("gameAnnouncement","Jawab benar untuk melompat menuju garis finis!");const track=document.createElement("div");track.className="race-track";players.forEach((_,i)=>{const runner=document.createElement("div");runner.className=`runner ${i?"second":""}`;runner.dataset.runner=String(i);runner.textContent="🏃";runner.setAttribute("aria-hidden","true");track.append(runner)});arena.append(track);players.forEach((p,i)=>{const card=document.createElement("article");card.className="panel";card.dataset.lane=String(i);const title=document.createElement("h3"),progress=document.createElement("p"),prompt=document.createElement("div"),options=document.createElement("div");title.textContent=p.name;progress.className="note progress";prompt.className="lane-question";options.className="options";card.append(title,progress,prompt,options);arena.append(card);updateLane(i)})}
$("soloBtn").addEventListener("click",()=>startGame(1));$("duetBtn").addEventListener("click",()=>startGame(2));
function updateLane(i){const p=players[i],card=$("arena").querySelector(`[data-lane="${i}"]`),runner=$("arena").querySelector(`[data-runner="${i}"]`);card.querySelector(".progress").textContent=`${p.distance}/7 petak · Tantangan ${Math.min(p.turn+1,10)}/10 · ${p.points} poin`;runner.style.left=`${3+p.distance*11.8}%`;const prompt=card.querySelector(".lane-question"),box=card.querySelector(".options");box.replaceChildren();if(gameOver||p.turn>=10||p.distance>=7){prompt.textContent=p.distance>=7?"🏁 Sampai di garis finis!":"Babak selesai.";return}const q=questions[(p.turn+i*3)%questions.length];prompt.textContent=q.q;q.o.forEach((text,n)=>{const b=document.createElement("button");b.type="button";b.className="option";b.textContent=`${"ABCD"[n]}. ${text}`;b.addEventListener("click",()=>answerGame(i,n));box.append(b)})}
function answerGame(i,choice){if(gameOver)return;const p=players[i];if(p.turn>=10||p.distance>=7)return;const q=questions[(p.turn+i*3)%questions.length];attempts++;if(choice===q.a){p.distance++;p.points+=10;hits++;tone(820);setText("gameAnnouncement",`${p.name}: benar! Lompat ke petak ${p.distance}.`)}else{tone(230);setText("gameAnnouncement",`${p.name}: belum tepat. Jawaban: ${q.o[q.a]}. ${q.e}`)}p.turn++;gameScore=players[0].points;updateLane(i);const runner=$("arena").querySelector(`[data-runner="${i}"]`);runner.classList.remove("hop");void runner.offsetWidth;if(choice===q.a)runner.classList.add("hop");if(p.distance>=7||players.every(x=>x.turn>=10||x.distance>=7)){gameOver=true;players.forEach((_,n)=>updateLane(n));const best=Math.max(...players.map(x=>x.distance));setText("gameAnnouncement",`Balapan selesai · jarak terjauh ${best} petak. Buka Hasil Belajar untuk melihat nilaimu.`)}}
function total(){return Math.round((quizScore+gameScore)/2)}
function badges(){const b=[];if(quizScore===100)b.push("Master Teori");if(players[0]?.distance>=7)b.push("Pelari Tangguh");if(total()>=66)b.push("Cendekiawan Muda");return b}
function renderResults(){setText("resultQuiz",`Kuis: ${quizScore}/100`);setText("resultGame",`Game: ${gameScore}/100`);setText("resultTotal",`Nilai akhir: ${total()}/100`);setText("resultAccuracy",`Akurasi sesi: ${attempts?Math.round(hits/attempts*100):0}%`);const box=$("badgeList");box.replaceChildren();if(!badges().length){const p=document.createElement("p");p.className="note";p.textContent="Belum ada lencana. Terus berlatih!";box.append(p)}else badges().forEach(name=>{const tag=document.createElement("span");tag.className="badge";tag.textContent=`✦ ${name}`;box.append(tag)});setText("resultStatus",total()>=66?"KKTP tercapai (minimal 66).":"KKTP belum tercapai. Pelajari materi dan coba lagi.");$("saveResult").disabled=saved||!(quizScore||players.length)}

async function initializeSheet(){const version=++loadVersion;ready=false;clearTimeout(loadTimer);setText("sheetStatus","Memuat rekap…");$("retrySheet").hidden=true;loadTimer=setTimeout(()=>{if(version!==loadVersion||ready)return;setText("sheetStatus","Rekap belum dapat dimuat. Coba lagi.");$("retrySheet").hidden=false},8000);if(!window.dataSdk){clearTimeout(loadTimer);setText("sheetStatus","Canva Sheet tidak tersedia. Coba lagi.");$("retrySheet").hidden=false;return}try{const result=await window.dataSdk.init({onDataChanged(data){if(version!==loadVersion)return;clearTimeout(loadTimer);ready=true;records=Array.isArray(data)?data:[];$("retrySheet").hidden=true;renderTable()}});if(!result.isOk){clearTimeout(loadTimer);setText("sheetStatus","Gagal menghubungkan Canva Sheet. Coba lagi.");$("retrySheet").hidden=false}}catch(_){clearTimeout(loadTimer);setText("sheetStatus","Gagal menghubungkan Canva Sheet. Coba lagi.");$("retrySheet").hidden=false}}
$("retrySheet").addEventListener("click",initializeSheet);
$("saveResult").addEventListener("click",async e=>{const button=e.currentTarget;if(!ready){setText("saveStatus","Canva Sheet belum siap. Buka Rekap Guru untuk mencoba lagi.");return}if(records.length>=999){setText("saveStatus","Batas 999 hasil tercapai.");return}if(saved)return;button.disabled=true;try{const result=await window.dataSdk.create({nama_siswa:player.name,kelas:player.kelas,skor_kuis:quizScore,skor_game:gameScore,total_nilai:total(),akurasi:attempts?Math.round(hits/attempts*100):0,badges:badges().join(", ")||"Belum ada",tanggal:new Date().toISOString()});if(!result.isOk)setText("saveStatus","Tidak dapat memastikan penyimpanan. Periksa rekap sebelum mencoba lagi.");else{saved=true;setText("saveStatus","Hasil berhasil disimpan ke Canva Sheet.")}}catch(_){setText("saveStatus","Tidak dapat memastikan penyimpanan. Periksa rekap sebelum mencoba lagi.")}finally{button.disabled=false;renderResults()}});
function renderTable(){const body=$("resultRows"),existing=new Map([...body.children].map(row=>[row.dataset.id,row]));records.forEach(record=>{const id=String(record.__backendId),row=existing.get(id)||document.createElement("tr");row.dataset.id=id;[record.nama_siswa||"—",record.kelas||"—",record.skor_kuis??0,record.skor_game??0,record.total_nilai??0].forEach((value,i)=>{let cell=row.children[i];if(!cell){cell=document.createElement("td");row.append(cell)}if(cell.textContent!==String(value))cell.textContent=String(value)});if(!row.children[5]){const cell=document.createElement("td"),button=document.createElement("button");button.type="button";button.className="small-btn";button.textContent="Hapus";button.setAttribute("aria-label",`Hapus hasil ${record.nama_siswa||"siswa"}`);button.addEventListener("click",()=>openDelete(row.dataset.id));cell.append(button);row.append(cell)}if(!row.isConnected)body.append(row);existing.delete(id)});existing.forEach(row=>row.remove());const count=records.length,average=count?Math.round(records.reduce((sum,r)=>sum+(Number(r.total_nilai)||0),0)/count):0;setText("classStats",`Jumlah hasil: ${count}/999 · Rata-rata: ${average}`);if(ready)setText("sheetStatus",count?`${count} hasil tersedia di Canva Sheet.`:"Belum ada hasil tersimpan.");$("exportCsv").disabled=!ready||!count}

$("confirmDelete").addEventListener("click",async e=>{const record=records.find(r=>String(r.__backendId)===deleteId);if(!record){setText("deleteStatus","Hasil tidak lagi tersedia.");return}const button=e.currentTarget;button.disabled=true;try{const result=await window.dataSdk.delete(record);if(!result.isOk)setText("deleteStatus","Tidak dapat memastikan penghapusan. Periksa rekap sebelum mencoba lagi.");else{[...$("resultRows").children].find(r=>r.dataset.id===deleteId)?.remove();closeDelete();setText("sheetStatus","Hasil berhasil dihapus dari Canva Sheet.")}}catch(_){setText("deleteStatus","Tidak dapat memastikan penghapusan. Periksa rekap sebelum mencoba lagi.")}finally{button.disabled=false}});
function csvCell(value){return `"${String(value??"").replace(/"/g,'""')}"`}
$("exportCsv").addEventListener("click",()=>{if(!ready||!records.length)return;const columns=["nama_siswa","kelas","skor_kuis","skor_game","total_nilai","akurasi","badges","tanggal"],lines=[columns.join(","),...records.map(r=>columns.map(key=>csvCell(r[key])).join(","))],blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="rekap-lari-karung-pai.csv";document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
initializeSheet();renderTable();
</script>
